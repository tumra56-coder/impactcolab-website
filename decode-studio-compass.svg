<svg width="100%" viewBox="0 0 680 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Split compass illustration for Decode Studio hero</title>
<desc>Left side shows dark green and orange abstract shapes with compass elements, right side shows green shapes and grid texture, framing the hero text</desc>

<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <clipPath id="left-clip">
    <rect x="0" y="0" width="200" height="480"/>
  </clipPath>
  <clipPath id="right-clip">
    <rect x="480" y="0" width="200" height="480"/>
  </clipPath>
</defs>

<g clip-path="url(#left-clip)">
  <rect x="20" y="30" width="130" height="110" rx="4" fill="#0d3d2a" opacity="0.2"/>
  <ellipse cx="90" cy="220" rx="100" ry="100" fill="#f58220" opacity="0.15"/>
  <rect x="30" y="310" width="80" height="70" rx="4" fill="#f58220" opacity="0.22"/>
  <rect x="100" y="370" width="90" height="80" rx="4" fill="#0d3d2a" opacity="0.18"/>
  <rect x="50" y="160" width="70" height="60" rx="4" fill="#f5f0e8" opacity="0.5"/>
  <g stroke="#1a1a1a" stroke-width="0.8" opacity="0.3">
    <line x1="340" y1="240" x2="0" y2="240"/>
    <line x1="340" y1="240" x2="140" y2="60"/>
    <line x1="340" y1="240" x2="100" y2="440"/>
    <line x1="340" y1="240" x2="200" y2="100"/>
    <line x1="340" y1="240" x2="200" y2="380"/>
  </g>
  <line x1="320" y1="240" x2="60" y2="240" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr)" fill="none" opacity="0.6"/>
  <line x1="326" y1="232" x2="150" y2="90" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)" fill="none" opacity="0.5"/>
  <line x1="326" y1="248" x2="160" y2="390" stroke="#1a1a1a" stroke-width="1.1" marker-end="url(#arr)" fill="none" opacity="0.4"/>
  <text x="42" y="236" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1a1a1a" opacity="0.4">W</text>
</g>

<g clip-path="url(#right-clip)">
  <ellipse cx="590" cy="160" rx="95" ry="95" fill="#1fb376" opacity="0.15"/>
  <rect x="520" y="260" width="140" height="110" rx="4" fill="#1fb376" opacity="0.18"/>
  <rect x="600" y="30" width="70" height="60" rx="4" fill="#f58220" opacity="0.2"/>
  <rect x="560" y="380" width="100" height="80" rx="4" fill="#0d3d2a" opacity="0.2"/>
  <g stroke="#1fb376" stroke-width="0.7" opacity="0.12" fill="none">
    <line x1="490" y1="300" x2="680" y2="300"/>
    <line x1="490" y1="318" x2="680" y2="318"/>
    <line x1="490" y1="336" x2="680" y2="336"/>
    <line x1="490" y1="354" x2="680" y2="354"/>
    <line x1="490" y1="372" x2="680" y2="372"/>
    <line x1="510" y1="290" x2="510" y2="390"/>
    <line x1="528" y1="290" x2="528" y2="390"/>
    <line x1="546" y1="290" x2="546" y2="390"/>
    <line x1="564" y1="290" x2="564" y2="390"/>
    <line x1="582" y1="290" x2="582" y2="390"/>
    <line x1="600" y1="290" x2="600" y2="390"/>
    <line x1="618" y1="290" x2="618" y2="390"/>
    <line x1="636" y1="290" x2="636" y2="390"/>
    <line x1="654" y1="290" x2="654" y2="390"/>
  </g>
  <g stroke="#1a1a1a" stroke-width="0.8" opacity="0.3">
    <line x1="340" y1="240" x2="680" y2="240"/>
    <line x1="340" y1="240" x2="540" y2="60"/>
    <line x1="340" y1="240" x2="560" y2="420"/>
  </g>
  <line x1="354" y1="228" x2="530" y2="80" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)" fill="none" opacity="0.5"/>
  <line x1="360" y1="240" x2="560" y2="240" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr)" fill="none" opacity="0.6"/>
  <line x1="354" y1="252" x2="500" y2="380" stroke="#1a1a1a" stroke-width="1.1" marker-end="url(#arr)" fill="none" opacity="0.4"/>
</g>

<line x1="340" y1="228" x2="340" y2="80" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr)" fill="none" opacity="0.6"/>
<line x1="340" y1="252" x2="340" y2="420" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr)" fill="none" opacity="0.5"/>
<circle cx="340" cy="240" r="70" fill="none" stroke="#1a1a1a" stroke-width="0.6" opacity="0.12"/>
<circle cx="340" cy="240" r="45" fill="none" stroke="#1a1a1a" stroke-width="0.5" opacity="0.08"/>
<text x="340" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1a1a1a" opacity="0.4">N</text>
<text x="340" y="438" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1a1a1a" opacity="0.4">S</text>
<circle cx="340" cy="240" r="4" fill="#1a1a1a" opacity="0.5"/>
<circle cx="340" cy="240" r="2" fill="white"/>

</svg>
