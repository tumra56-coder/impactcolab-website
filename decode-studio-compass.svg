  <line x1="150" y1="300" x2="150" y2="500"/>
  <line x1="150" y1="300" x2="0" y2="300"/>
  <line x1="150" y1="300" x2="300" y2="300"/>
  <line x1="150" y1="300" x2="50" y2="200"/>
  <line x1="150" y1="300" x2="250" y2="400"/>
  <line x1="150" y1="300" x2="250" y2="200"/>
  <line x1="150" y1="300" x2="50" y2="400"/>
