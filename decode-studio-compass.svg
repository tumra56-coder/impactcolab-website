<line x1="145" y1="288" x2="60" y2="180" stroke="#1a1a1a" stroke-width="1.1" marker-end="url(#a)" fill="none" opacity="0.22"/>
<line x1="155" y1="288" x2="240" y2="180" stroke="#1a1a1a" stroke-width="1.1" marker-end="url(#a)" fill="none" opacity="0.2"/>
