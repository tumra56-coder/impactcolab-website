<svg width="100%" viewBox="0 0 300 600" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Compass illustration for Decode Studio</title>
<desc>Compass rose with concentric rings in brand colours</desc>

<defs>
  <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Concentric rings — alternating green and orange -->
<circle cx="150" cy="300" r="25" fill="none" stroke="#1fb376" stroke-width="1" opacity="0.25"/>
<circle cx="150" cy="300" r="50" fill="none" stroke="#f58220" stroke-width="1" opacity="0.2"/>
<circle cx="150" cy="300" r="80" fill="none" stroke="#1fb376" stroke-width="0.8" opacity="0.18"/>
<circle cx="150" cy="300" r="115" fill="none" stroke="#f58220" stroke-width="0.8" opacity="0.14"/>
<circle cx="150" cy="300" r="155" fill="none" stroke="#1fb376" stroke-width="0.7" opacity="0.1"/>
<circle cx="150" cy="300" r="200" fill="none" stroke="#f58220" stroke-width="0.6" opacity="0.07"/>

<!-- Starburst lines — green -->
<g stroke="#1fb376" stroke-width="0.8" opacity="0.2">
  <line x1="150" y1="300" x2="150" y2="100"/>
  <line x1="150" y1="300" x2="150" y2="500"/>
  <line x1="150" y1="300" x2="0" y2="300"/>
  <line x1="150" y1="300" x2="300" y2="300"/>
  <line x1="150" y1="300" x2="50" y2="200"/>
  <line x1="150" y1="300" x2="250" y2="400"/>
  <line x1="150" y1="300" x2="250" y2="200"/>
  <line x1="150" y1="300" x2="50" y2="400"/>
</g>

<!-- Arrows — orange -->
<line x1="145" y1="288" x2="65" y2="185" stroke="#f58220" stroke-width="1.4" marker-end="url(#ao)" fill="none" opacity="0.35"/>
<line x1="155" y1="288" x2="235" y2="185" stroke="#f58220" stroke-width="1.4" marker-end="url(#ao)" fill="none" opacity="0.3"/>
<line x1="145" y1="312" x2="65" y2="415" stroke="#f58220" stroke-width="1.3" marker-end="url(#ao)" fill="none" opacity="0.28"/>
<line x1="155" y1="312" x2="235" y2="415" stroke="#f58220" stroke-width="1.3" marker-end="url(#ao)" fill="none" opacity="0.28"/>
<line x1="132" y1="300" x2="20" y2="300" stroke="#1fb376" stroke-width="1.4" marker-end="url(#ao)" fill="none" opacity="0.3"/>
<line x1="168" y1="300" x2="280" y2="300" stroke="#1fb376" stroke-width="1.4" marker-end="url(#ao)" fill="none" opacity="0.3"/>

<!-- Centre dot — orange -->
<circle cx="150" cy="300" r="4" fill="#f58220" opacity="0.5"/>
<circle cx="150" cy="300" r="2" fill="#1fb376" opacity="0.7"/>

</svg>
