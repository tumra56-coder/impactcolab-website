    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<circle cx="150" cy="300" r="25" fill="none" stroke="#1a1a1a" stroke-width="0.5" opacity="0.15"/>
<circle cx="150" cy="300" r="50" fill="none" stroke="#1a1a1a" stroke-width="0.5" opacity="0.12"/>
<circle cx="150" cy="300" r="80" fill="none" stroke="#1a1a1a" stroke-width="0.5" opacity="0.1"/>
<circle cx="150" cy="300" r="115" fill="none" stroke="#1a1a1a" stroke-width="0.4" opacity="0.07"/>
<circle cx="150" cy="300" r="155" fill="none" stroke="#1a1a1a" stroke-width="0.4" opacity="0.05"/>
<circle cx="150" cy="300" r="200" fill="none" stroke="#1a1a1a" stroke-width="0.4" opacity="0.03"/>

<g stroke="#1a1a1a" stroke-width="0.6" opacity="0.15">
